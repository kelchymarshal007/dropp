events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        # WebSocket endpoint
        location /api/v1/feed/ws/ {
            set $ws_host "api:8000";
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$ws_host$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # REST API - strips /api prefix
        location /api/ {
            set $api_host "api:8000";
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api_host$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Media files
        location /media/ {
            set $media_host "api:8000";
            proxy_pass http://$media_host$uri$is_args$args;
            proxy_set_header Host $host;
        }

        # Next.js Frontend
        location / {
            set $web_host "web:3000";
            proxy_pass http://$web_host$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
