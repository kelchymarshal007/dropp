services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  api:
    build: 
      context: ./dropp-api
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - ./dropp-api:/app
      - ./gateways.json:/app/gateways.json
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./dropp-worker
    env_file: .env
    volumes:
      - ./dropp-worker:/app
    depends_on:
      - redis

  web:
    build:
      context: ./dropp-web
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./dropp-web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  pgdata:
