services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropp -d dropp_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  api:
    build: 
      context: ./dropp-api
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - ./dropp-api:/app
      - ./gateways.json:/app/gateways.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Main Worker (Timers)
  worker:
    build:
      context: ./dropp-worker
    env_file: .env
    command: celery -A app.tasks.timers worker --loglevel=info -Q celery
    volumes:
      - ./dropp-worker:/app
    depends_on:
      - redis

  # Dedicated Email Worker
  worker-email:
    build:
      context: ./dropp-worker
    env_file: .env
    command: celery -A app.tasks.notifications worker --loglevel=info -Q notifications_email
    volumes:
      - ./dropp-worker:/app
    depends_on:
      - redis

  # Dedicated SMS Worker
  worker-sms:
    build:
      context: ./dropp-worker
    env_file: .env
    command: celery -A app.tasks.notifications worker --loglevel=info -Q notifications_sms
    volumes:
      - ./dropp-worker:/app
    depends_on:
      - redis

  # Media Worker (FFmpeg)
  media-worker:
    build:
      context: ./dropp-worker
    env_file: .env
    command: celery -A app.tasks.media worker --loglevel=info -Q media
    volumes:
      - ./dropp-worker:/app
      - ./media_temp:/tmp/media
    depends_on:
      - redis

  web:
    build:
      context: ./dropp-web
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./dropp-web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  pgdata:
