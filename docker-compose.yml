services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropp -d dropp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  api:
    build: 
      context: ./dropp-api
    env_file: .env
    volumes:
      - ./dropp-api:/app
      - ./gateways.json:/app/gateways.json
      - ./media_raw:/tmp/media_raw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./dropp-worker
    env_file: .env
    command: celery -A app.tasks.timers worker --loglevel=info -Q celery
    volumes:
      - ./dropp-worker:/app
    depends_on:
      - redis

  worker-email:
    build:
      context: ./dropp-worker
    env_file: .env
    command: celery -A app.tasks.notifications worker --loglevel=info -Q notifications_email
    volumes:
      - ./dropp-worker:/app
    depends_on:
      - redis

  worker-sms:
    build:
      context: ./dropp-worker
    env_file: .env
    command: celery -A app.tasks.notifications worker --loglevel=info -Q notifications_sms
    volumes:
      - ./dropp-worker:/app
    depends_on:
      - redis

  media-worker:
    build:
      context: ./dropp-worker
    env_file: .env
    command: celery -A app.tasks.media worker --loglevel=info -Q media
    volumes:
      - ./dropp-worker:/app
      - ./media_raw:/tmp/media_raw
    depends_on:
      - redis

  web:
    build:
      context: ./dropp-web
    env_file: .env
    volumes:
      - ./dropp-web:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run build && npm run start"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
